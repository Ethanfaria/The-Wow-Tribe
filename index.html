<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Wow Tribe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body style="font-family: &quot;Libre Baskerville&quot;, serif">
    <nav></nav>
    <div class="min-h-screen bg-orange-50 flex flex-col">
      <section
        class="min-h-screen flex items-center md:pt-24 md:pb-16 px-2 md:px-6"
      >
        <div class="max-w-3xl mx-auto text-center space-y-6">
          <h1 class="text-3xl md:text-6xl font-bold">
            You Were Built to
            <span class="text-purple-800 italic">Lead.</span><br />
            Your <span class="text-purple-800 italic">Tribe</span> is Waiting.
          </h1>
          <p class="text-xs md:text-base">
            Join India’s most energising community for women entrepreneurs -
            where business coaching, sisterhood, and unstoppable ambition come
            together.
          </p>
          <button
            class="px-6 py-3 bg-purple-800 text-white rounded-full hover:bg-purple-700 transition"
          >
            Find Your Tribe
          </button>
          <button
            class="px-6 py-3 bg-transparent border-2 border-purple-800 text-purple-800 rounded-full hover:bg-purple-800 hover:text-white transition"
          >
            Learn More
          </button>
          <p class="text-base text-gray-600">
            Empowering women to scale with confidence.
          </p>
        </div>
      </section>
      <section
        class=" flex flex-col justify-center py-20 px-6 bg-white"
      >
        <div class="max-w-6xl mx-auto w-full">
          <div class="text-center mb-14">
            <p class="text-purple-500 uppercase tracking-widest text-sm mb-2">
              Our Courses
            </p>
            <h2 class="text-4xl font-bold">
              Learn & <span class="text-purple-800 italic">Grow</span>
            </h2>
          </div>
          <div
            class="grid grid-cols-2 md:grid-cols-4 gap-4"
            id="courses-grid"
          ></div>
        </div>
      </section>
      <section class="min-h-screen">hi</section>
      <section class="min-h-screen py-20 px-6 bg-white">
        <div class="max-w-3xl mx-auto">
          <div class="text-center mb-14">
            <p class="text-purple-500 uppercase tracking-widest text-sm mb-2">
              Real Stories
            </p>
            <h2 class="text-4xl font-bold">
              What Our <span class="text-purple-800 italic">Tribe</span> Says
            </h2>
          </div>
          <div class="overflow-hidden" id="carousel">
            <div
              class="flex transition-transform duration-500 ease-[cubic-bezier(0.4,0,0.2,1)]"
              id="track"
            ></div>
          </div>
          <div class="flex items-center justify-center gap-6 mt-10">
            <button
              class="bg-purple-800 w-5 h-5 flex items-center justify-center p-6 rounded-full text-orange-50 hover:bg-purple-700 transition"
              id="prev-btn"
            >
              &#8592;
            </button>
            <div class="flex gap-2" id="dots"></div>
            <button
              class="bg-purple-800 w-5 h-5 flex items-center justify-center p-6 rounded-full text-orange-50 hover:bg-purple-700 transition"
              id="next-btn"
            >
              &#8594;
            </button>
          </div>
        </div>
      </section>
    </div>
    <script>
      const courses = [
        {
          title: "Clarity Circle",
          price: "₹2,999",
          tag: "Starter",
          image: "https://placehold.co/400x400",
          link: "https://your-link.com",
        },
        {
          title: "Strategy Squad",
          price: "₹5,999",
          tag: "Growth",
          image: "https://placehold.co/400x400",
          link: "https://your-link.com",
        },
        {
          title: "Legacy Leaders",
          price: "₹9,999",
          tag: "Advanced",
          image: "https://placehold.co/400x400",
          link: "https://your-link.com",
        },
        {
          title: "The Inner Circle",
          price: "₹19,999",
          tag: "Premium",
          image: "https://placehold.co/400x400",
          link: "https://your-link.com",
        },
      ];

      const grid = document.getElementById("courses-grid");
      courses.forEach((c) => {
        grid.innerHTML += `
    <a href="${c.link}" target="_blank" class="bg-white rounded-2xl overflow-hidden border border-orange-100 hover:shadow-md transition hover:-translate-y-1 flex flex-col">
      <img src="${c.image}" alt="${c.title}" class="w-full aspect-square object-cover" />
      <div class="p-4">
        <p class="text-purple-500 text-xs uppercase tracking-widest mb-1">${c.tag}</p>
        <p class="font-bold text-gray-900 text-sm">${c.title}</p>
        <p class="text-purple-800 font-bold mt-1">${c.price}</p>
      </div>
    </a>`;
      });

      const testimonials = [
        {
          name: "Sneha Parab",
          position: "Social Expertise",
          testimonial:
            "I had the pleasure of attending Massarat’s Vibes & Verbs session during our business networking meeting, and it was truly insightful. Her approach was clear, engaging, and full of practical value. The session brought great energy to the room and left us all with meaningful takeaways. It was a wonderful experience, and I’m glad I got to be a part of it.",
        },
        {
          name: "Asha Mahadevaswamy",
          position: "The Kamala Flow",
          testimonial:
            "Massarat Ma’am is truly inspiring and has played a significant role in the growth of my business. Her guidance brings clarity, confidence, and a fresh perspective that pushed me to become my best.",
        },
        {
          name: "Nandini Karmarkar",
          position: "Nutrilite",
          testimonial:
            "Massarat Kang is one of the best trainers I have ever seen. I have done a few workshops with her and each one has been excellent value. She has the ability to simplify the most difficult concepts. She has a thorough knowledge of various types of businesses and offers valuable and practical advice to enhance your business.",
        },
        {
          name: "Flora Lopes",
          position: "Co-Founder - Da Baker",
          testimonial:
            "Massarat Kang is a well-established holistic business coach with extensive knowledge and deep expertise in the world of business. She provides valuable guidance to startups, supports independent businesswomen, and helps established organizations put effective systems in place. Attending her workshops is an enriching experience, as she shares practical, real-world examples that can be applied with ease to your own ventures. In short, Massarat truly knows her subject. She brings boundless enthusiasm and a consistent “can-do” attitude, inspiring everyone she works with to achieve greater success. Flora Lopes",
        },
        {
          name: "Divya Sharma",
          position: "Glam up by Divyaa.",
          testimonial:
            "Massarat Kang is a highly accomplished business coach with an exceptional command over professional growth and leadership development. Her structured methodologies, strategic insights, and ability to deliver clear, outcome-oriented guidance truly distinguish her in her field. Having personally attended her sessions, I can confidently affirm the high level of excellence, integrity, and professionalism she demonstrates in every aspect of her work.Beyond her expertise, Massarat is remarkably kind-hearted, approachable, and genuinely committed to understanding the unique needs of each individual. Her friendly nature and empathetic approach create a positive, supportive, and highly motivating environment for personal and professional growth.",
        },
        {
          name: "Tricia Saldanha",
          position: "Green Aura",
          testimonial:
            "Massarat Kaur Kang comes up with unique business coaching subjects. I myself attended her course. Her coaching style is interactive, interesting and motivational offering personalized attention and fostering a learning environment. Massarat is well versed with all modern day issues regarding business startups and is an expert in business scaling and revenue growth. Highly recommended her coaching classes. She is an excellent coach with lots of patience and a lovely personality",
        },
        {
          name: "Sneha",
          position: "Insurance",
          testimonial:
            "Thankyou Massarat Kaur Kang for holding such an insightful session today for all of us, really helped us think beyond our realme and definately will find the answers to the questions we went clueless about, but which were necessary when it came to scaling our businesses.",
        },
        {
          name: "Aisha Shaikh",
          position: "Aisha's Kitchen",
          testimonial:
            "Massarat Kaur Kang She’s really good at giving business tips, and she makes everything sound easy to understand.I like the way she explains things because it’s simple and helpful. She puts effort into what she shares, and it shows in how useful her advice is.She’s very empathetic and a very kind person and the right person to approach when needing advice",
        },
      ];
      const track = document.getElementById("track");
      const dotsContainer = document.getElementById("dots");
      const total = testimonials.length;

      function buildCard(t) {
        const card = document.createElement("div");
        card.className = "min-w-full px-4 flex";
        card.innerHTML = `
    <div class="bg-orange-50 rounded-3xl p-10 md:p-14 shadow-sm border border-orange-100 w-full justify-center flex flex-col ">
      <span class="font-bold text-4xl text-purple-700 italic ">"</span>
      <div>
        <p class="text-gray-700 text-sm md:text-xl leading-relaxed italic mb-2 line-clamp-6">${t.testimonial}</p>
        <button class="text-purple-700 text-sm font-semibold read-more-btn hidden">Read more</button>
      </div>
      <div class="flex items-center mt-5 gap-4">
        <div class="w-10 h-10 md:w-12 md:h-12 rounded-full bg-purple-200 flex items-center justify-center text-purple-800 font-bold text-sm md:text-lg shrink-0">${t.name.charAt(0)}</div>
        <div>
          <p class="font-bold text-gray-900">${t.name}</p>
          <p class="text-purple-600 text-xs md:text-sm">${t.position}</p>
        </div>
      </div>
    </div>`;
        const p = card.querySelector("p");
        const btn = card.querySelector(".read-more-btn");
        btn.addEventListener("click", () => {
          const clamped = p.classList.toggle("line-clamp-6");
          btn.textContent = clamped ? "Read more" : "Read less";
        });
        return card;
      }

      function checkClamp(card) {
        const p = card.querySelector("p");
        const btn = card.querySelector(".read-more-btn");
        if (p.scrollHeight > p.clientHeight) {
          btn.classList.remove("hidden");
        }
      }
      testimonials.forEach((t) => track.appendChild(buildCard(t)));

      const firstClone = buildCard(testimonials[0]);
      const lastClone = buildCard(testimonials[total - 1]);
      track.appendChild(firstClone);
      track.insertBefore(lastClone, track.firstChild);

      let current = 1;

      testimonials.forEach((_, i) => {
        const dot = document.createElement("button");
        dot.className = "w-3 h-3 rounded-full bg-purple-300";
        if (i === 0) dot.classList.add("active");
        dot.addEventListener("click", () => goTo(i + 1));
        dotsContainer.appendChild(dot);
      });

      requestAnimationFrame(() => checkClamp(track.children[current]));

      function updateUI(animate = true) {
        if (!animate) track.style.transition = "none";
        else track.style.transition = "";
        track.style.transform = `translateX(-${current * 100}%)`;
        const realIndex = (current - 1 + total) % total;
        Array.from(dotsContainer.children).forEach((dot, i) => {
          dot.classList.toggle("dot-active", i === realIndex);
        });
      }

      function goTo(index) {
        current = index;
        updateUI();
        checkClamp(track.children[current]);

        // If we landed on a clone, silently jump to the real slide
        track.addEventListener(
          "transitionend",
          () => {
            if (current === 0) {
              current = total;
              updateUI(false);
            }
            if (current === total + 1) {
              current = 1;
              updateUI(false);
            }
          },
          { once: true },
        );
      }

      document.getElementById("next-btn").onclick = () => goTo(current + 1);
      document.getElementById("prev-btn").onclick = () => goTo(current - 1);

      // Auto-play
      let autoPlay = setInterval(() => goTo(current + 1), 5000);
      document.getElementById("carousel").onmouseenter = () =>
        clearInterval(autoPlay);
      document.getElementById("carousel").onmouseleave = () =>
        (autoPlay = setInterval(() => goTo(current + 1), 5000));
    </script>
  </body>
</html>
