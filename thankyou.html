<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Thank You – The Wow Tribe</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="assets/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="assets/favicon-16x16.png"
    />
    <link rel="icon" href="assets/favicon.ico" />
    <link rel="manifest" href="assets/site.webmanifest" />

    <!-- Shared stylesheet -->
    <link rel="stylesheet" href="assets/style.css" />
    <style type="text/tailwindcss">
      @theme {
        --font-serif: "Libre Baskerville", serif;
      }
    </style>
  </head>
  <body class="bg-orange-50 font-serif m-0 flex flex-col min-h-screen">
    <!-- ══════════════ NAVBAR ══════════════ -->
    <nav
      id="navbar"
      class="fixed top-0 left-0 right-0 z-50 transition-[background-color,box-shadow] duration-300"
    >
      <div
        class="w-full px-4 sm:px-6 lg:px-8 flex items-center justify-between h-20 md:h-24"
      >
        <a href="index.html" class="flex items-center gap-3 shrink-0">
          <img src="assets/logo.svg" class="h-24 w-auto" alt="The Wow Tribe" />
        </a>

        <!-- Desktop links -->
        <div id="nav-links" class="hidden md:flex items-center gap-1 lg:gap-2">
          <a
            href="index.html"
            data-nav-link
            class="px-3 py-2 text-sm text-purple-900 hover:text-purple-600 transition font-medium"
            >Home</a
          >
          <a
            href="about.html"
            data-nav-link
            class="px-3 py-2 text-sm text-purple-900 hover:text-purple-600 transition font-medium"
            >About</a
          >
          <a
            href="community.html"
            data-nav-link
            class="px-3 py-2 text-sm text-purple-900 hover:text-purple-600 transition font-medium"
            >Community</a
          >
          <a
            href="contact.html"
            class="cta-btn ml-3 px-5 py-2 bg-purple-800 text-white text-sm rounded-full hover:bg-purple-700 transition font-medium shadow-sm"
            >Contact</a
          >
        </div>

        <!-- Hamburger (mobile only) -->
        <button
          id="hamburger-btn"
          aria-label="Open menu"
          class="flex md:hidden bg-transparent border-0 cursor-pointer flex-col gap-[5px] items-center justify-center p-1.5"
        >
          <span class="block w-6 h-0.5 bg-purple-900 rounded-full transition-colors"></span>
          <span class="block w-6 h-0.5 bg-purple-900 rounded-full transition-colors"></span>
          <span class="block w-6 h-0.5 bg-purple-900 rounded-full transition-colors"></span>
        </button>
      </div>
    </nav>

    <!-- Drawer overlay -->
    <div
      id="drawer-overlay"
      class="hidden fixed inset-0 bg-[rgba(30,0,60,0.55)] z-40 transition-opacity duration-300"
    ></div>

    <!-- Mobile drawer -->
    <div
      id="mobile-drawer"
      aria-hidden="true"
      class="fixed top-0 right-0 w-[72%] max-w-[280px] h-full bg-orange-50 z-50 translate-x-full transition-transform duration-300 ease-[cubic-bezier(0.4,0,0.2,1)] flex flex-col px-7 pt-6 pb-10 shadow-[-8px_0_32px_rgba(80,0,120,0.15)]"
    >
      <button
        id="drawer-close"
        aria-label="Close menu"
        class="self-end bg-transparent border-0 cursor-pointer text-[22px] text-purple-900 px-1.5 py-1 leading-none mb-7"
      >
        ✕
      </button>
      <a
        href="index.html"
        class="block py-3.5 px-1 text-[15px] text-purple-950 font-medium no-underline border-b border-b-violet-100 font-serif"
        >Home</a
      >
      <a
        href="about.html"
        class="block py-3.5 px-1 text-[15px] text-purple-950 font-medium no-underline border-b border-b-violet-100 font-serif"
        >About</a
      >
      <a
        href="community.html"
        class="block py-3.5 px-1 text-[15px] text-purple-950 font-medium no-underline border-b border-b-violet-100 font-serif"
        >Community</a
      >
      <a
        href="contact.html"
        class="mt-6 bg-purple-800 hover:bg-purple-700 !text-white rounded-full text-center py-3.5 border-b-0 font-semibold font-serif no-underline"
        >Contact</a
      >
    </div>

    <!-- ══════════════ THANK YOU CONTENT ══════════════ -->
    <main class="flex-grow flex items-center justify-center pt-32 pb-16 px-4">
      <div
        class="max-w-2xl w-full bg-white rounded-3xl p-10 sm:p-14 border border-orange-100 shadow-sm text-center space-y-8"
      >
        <div
          class="w-20 h-20 mx-auto bg-orange-200 rounded-full flex items-center justify-center shadow-sm"
        >
          <svg
            class="w-10 h-10 text-purple-900"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M5 13l4 4L19 7"
            ></path>
          </svg>
        </div>

        <div class="space-y-4">
          <h1 class="text-4xl sm:text-5xl font-bold text-gray-900">
            Thank <span class="italic text-purple-800">You</span>
          </h1>
          <p
            class="text-sm sm:text-base md:text-lg text-gray-600 leading-relaxed max-w-lg mx-auto"
          >
            We've received your application and will contact you shortly. Your
            journey with the tribe begins soon.
          </p>
        </div>

        <div class="pt-6">
          <a
            href="index.html"
            class="inline-block border-2 border-purple-800 text-purple-800 font-bold hover:bg-purple-800 hover:text-white rounded-full py-3 px-8 transition-colors duration-300"
          >
            Return to Home
          </a>
        </div>
      </div>
    </main>

    <!-- ══════════════ FOOTER ══════════════ -->
    <footer
      class="bg-violet-950 border-t border-purple-800 py-6 px-4 text-center"
    >
      <p class="text-purple-400 text-xs sm:text-sm">
        © 2026 The Wow Tribe. All rights reserved.
      </p>
    </footer>

    <!-- ══════════════ SCRIPTS ══════════════ -->
    <script src="assets/site.js"></script>
    <script src="assets/js/thank-you.js"></script>
  </body>
</html>
